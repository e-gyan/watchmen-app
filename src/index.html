<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Watchman - Partner Prayer & Testimony Tracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Watchman" />
    <meta name="description" content="An analytical prayer accountability tracker for partners to log prayer hours and minutes against daily, weekly, and period targets (e.g. 100 hours), document prayer sessions, and keep a testimony record." />
    <meta property="og:title" content="Watchman - Partner Prayer & Testimony Tracker" />
    <meta property="og:description" content="An analytical prayer accountability tracker for partners to log prayer hours and minutes against daily, weekly, and period targets (e.g. 100 hours), document prayer sessions, and keep a testimony record." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('watchman_theme_pref');
          var now = new Date();
          var mins = now.getHours() * 60 + now.getMinutes();
          var scheduled = (mins >= 405 && mins < 1125) ? 'light' : 'dark';
          var mode = (pref === 'light' || pref === 'dark') ? pref : scheduled;
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(mode);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="antialiased font-sans selection:bg-amber-500/30 selection:text-amber-200">
    <app-root></app-root>
  </body>
</html>
